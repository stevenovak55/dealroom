<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA Deal Room - Vendor Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            color: #666;
            font-size: 16px;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c00;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .error h2 {
            margin-bottom: 10px;
        }

        .portal-content {
            display: none;
        }

        .portal-content.active {
            display: block;
        }

        .section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }

        .section:last-child {
            border-bottom: none;
        }

        .section h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.sent {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge.opened {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .info-item {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .info-item label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .info-item value {
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MA Deal Room</h1>
            <p>Vendor Portal</p>
        </div>

        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p>Loading your vendor portal...</p>
        </div>

        <div id="errorState" style="display: none;">
            <div class="error">
                <h2>Unable to Load Vendor Portal</h2>
                <p id="errorMessage"></p>
            </div>
        </div>

        <div id="portalContent" class="portal-content">
            <div class="section">
                <h2>
                    Request Status
                    <span class="badge" id="statusBadge"></span>
                </h2>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Request ID</label>
                        <value id="requestId">-</value>
                    </div>
                    <div class="info-item">
                        <label>Type</label>
                        <value id="vendorType">-</value>
                    </div>
                    <div class="info-item">
                        <label>Status</label>
                        <value id="requestStatus">-</value>
                    </div>
                    <div class="info-item">
                        <label>Created</label>
                        <value id="createdAt">-</value>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Vendor Information</h2>
                <div class="info-grid">
                    <div class="info-item">
                        <label>Vendor Name</label>
                        <value id="vendorName">-</value>
                    </div>
                    <div class="info-item">
                        <label>Company</label>
                        <value id="vendorCompany">-</value>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Available Actions</h2>
                <div class="actions">
                    <button class="btn btn-primary" onclick="alert('Schedule Appointment feature coming soon!')">Schedule Appointment</button>
                    <button class="btn btn-primary" onclick="alert('Submit Availability feature coming soon!')">Submit Availability</button>
                    <button class="btn btn-secondary" onclick="alert('Upload Documents feature coming soon!')">Upload Documents</button>
                    <button class="btn btn-secondary" onclick="alert('Send Message feature coming soon!')">Send Message</button>
                </div>
            </div>

            <div class="section" style="border-bottom: none;">
                <p style="color: #999; font-size: 12px;">
                    <strong>Portal Token:</strong> <code id="tokenDisplay" style="background: #f0f0f0; padding: 2px 6px; border-radius: 3px;">Loading...</code>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Get token from URL
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const apiBase = '/wp-json/ma-deal-room/v1';

        async function loadVendorPortal() {
            if (!token) {
                showError('Missing token. Please access the vendor portal with a valid token in the URL.');
                return;
            }

            try {
                // Fetch vendor portal data
                const response = await fetch(`${apiBase}/vendor/${token}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    if (response.status === 404) {
                        showError('Invalid or expired token.');
                    } else {
                        showError(`Error: ${response.statusText}`);
                    }
                    return;
                }

                const data = await response.json();

                if (data.success === false) {
                    showError(data.message || 'Unable to load vendor portal data');
                    return;
                }

                // Display vendor data
                displayVendorData(data.data);
            } catch (error) {
                console.error('Error loading vendor portal:', error);
                showError('Unable to connect to the server. Please check your internet connection.');
            }
        }

        function displayVendorData(data) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('portalContent').classList.add('active');

            // Populate data
            document.getElementById('requestId').textContent = data.request?.id || '-';
            document.getElementById('vendorType').textContent = data.request?.vendor_type || '-';
            document.getElementById('requestStatus').textContent = data.request?.status || '-';
            document.getElementById('createdAt').textContent = new Date(data.request?.created_at).toLocaleDateString() || '-';
            document.getElementById('vendorName').textContent = data.request?.vendor_name || '-';
            document.getElementById('vendorCompany').textContent = data.request?.vendor_company || '-';

            // Set status badge
            const status = data.request?.status;
            const badge = document.getElementById('statusBadge');
            badge.textContent = status ? status.toUpperCase() : 'UNKNOWN';
            badge.className = `badge ${status}`;

            // Display token (first 8 chars + ...)
            document.getElementById('tokenDisplay').textContent = token.substring(0, 8) + '...';
        }

        function showError(message) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('portalContent').classList.remove('active');
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }

        // Load portal when page loads
        window.addEventListener('load', loadVendorPortal);
    </script>
</body>
</html>
