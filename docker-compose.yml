services:
  # WordPress Container
  wordpress:
    image: wordpress:6.4-php8.2-apache
    container_name: ma-dealroom-wp
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-ma_dealroom}
      WORDPRESS_DB_USER: ${DB_USER:-dealroom}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-dealroom_dev_pass}
      WORDPRESS_DEBUG: ${WP_DEBUG:-true}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('SAVEQUERIES', true);
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
    volumes:
      - wordpress_data:/var/www/html
      - ./ma-deal-room:/var/www/html/wp-content/plugins/ma-deal-room
      - ./uploads:/var/www/html/wp-content/uploads
    depends_on:
      - mysql
      - redis
    networks:
      - dealroom-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ma-dealroom-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pass}
      MYSQL_DATABASE: ${DB_NAME:-ma_dealroom}
      MYSQL_USER: ${DB_USER:-dealroom}
      MYSQL_PASSWORD: ${DB_PASSWORD:-dealroom_dev_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    networks:
      - dealroom-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Redis for Object Caching (Optional but recommended for scale)
  redis:
    image: redis:7-alpine
    container_name: ma-dealroom-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - dealroom-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # WP-CLI Container (for running background jobs)
  wpcli:
    image: wordpress:cli-php8.2
    container_name: ma-dealroom-cli
    user: "33:33"  # www-data user
    volumes:
      - wordpress_data:/var/www/html
      - ./ma-deal-room:/var/www/html/wp-content/plugins/ma-deal-room
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-ma_dealroom}
      WORDPRESS_DB_USER: ${DB_USER:-dealroom}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-dealroom_dev_pass}
    depends_on:
      - mysql
      - wordpress
    networks:
      - dealroom-network
    command: tail -f /dev/null  # Keep container running

  # PhpMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ma-dealroom-pma
    ports:
      - "${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-dealroom}
      PMA_PASSWORD: ${DB_PASSWORD:-dealroom_dev_pass}
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - dealroom-network
    restart: unless-stopped

volumes:
  wordpress_data:
    name: ma-dealroom-wp-data
  mysql_data:
    name: ma-dealroom-mysql-data
  redis_data:
    name: ma-dealroom-redis-data

networks:
  dealroom-network:
    name: ma-dealroom-network
    driver: bridge
