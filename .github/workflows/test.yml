name: PHP Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, gd, json, pcre, spl, simplexml, xmlwriter
          coverage: xdebug

      - name: Validate composer.json and composer.lock
        run: |
          cd ma-deal-room
          composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: ma-deal-room/vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: |
          cd ma-deal-room
          composer install --prefer-dist --no-progress --no-suggest

      - name: Create test directories
        run: |
          cd ma-deal-room
          mkdir -p coverage/html coverage/text

      - name: Run PHPUnit tests
        run: |
          cd ma-deal-room
          composer test

      - name: Run PHPUnit tests with coverage
        if: matrix.php == '8.2'
        run: |
          cd ma-deal-room
          XDEBUG_MODE=coverage ./vendor/bin/phpunit --coverage-text --coverage-html coverage/html --coverage-clover coverage/clover.xml

      - name: Upload coverage reports to Codecov
        if: matrix.php == '8.2'
        uses: codecov/codecov-action@v3
        with:
          files: ./ma-deal-room/coverage/clover.xml
          flags: php-tests
          name: php-${{ matrix.php }}
          fail_ci_if_error: false

      - name: Archive code coverage results
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v3
        with:
          name: code-coverage-report
          path: ma-deal-room/coverage/html
          retention-days: 7

      - name: Check test coverage threshold
        if: matrix.php == '8.2'
        run: |
          cd ma-deal-room
          # Extract coverage percentage from clover.xml
          COVERAGE=$(php -r '$xml = simplexml_load_file("coverage/clover.xml"); $metrics = $xml->project->metrics; $total = (int)$metrics["elements"]; $covered = (int)$metrics["coveredelements"]; echo round(($covered / $total) * 100, 2);')
          echo "Code coverage: $COVERAGE%"
          # Warn if coverage is below target (not failing build)
          if (( $(echo "$COVERAGE < 50.0" | bc -l) )); then
            echo "::warning::Code coverage ($COVERAGE%) is below 50% target"
          fi
